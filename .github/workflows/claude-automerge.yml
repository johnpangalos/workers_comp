name: Auto-merge low-risk PRs

# Low-risk PRs merge with no person in the loop once the automated checks are clean, as in
# the Claude Code team's process (REVIEW.md, "Risk tiers"). After both Claude reviews of a
# commit finish, this turns on GitHub's auto-merge when all of these hold:
#   - the PR is johnpangalos's, from a branch in this repo, and not a draft;
#   - every file it touches is on the low-risk list below (a fixed check the change can't
#     argue with);
#   - the Claude review of that commit says "Nothing to fix." and risk=low (its own read of
#     the change, which can only make this stricter);
#   - the security review of that commit says "No security findings.".
# GitHub then merges once the required checks pass and every thread is resolved. A new push
# turns auto-merge off again until both reviews of the new commit say the same.
#
# No Claude call and no PR code runs here: it only reads the PR and the reviews' comments.

on:
  pull_request:
    types: [synchronize, reopened]
  workflow_run:
    workflows: [Claude review, Claude security review]
    types: [completed]

permissions: {}

jobs:
  # A new commit can't ride on the decision made for an earlier one.
  reset:
    if: github.event_name == 'pull_request' && github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn auto-merge off until this commit is reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto

  decide:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn auto-merge on if the PR is low risk and both reviews are clean
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          skip() { echo "Not auto-merging: $1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

          pr=$(gh api "repos/$R/commits/$SHA/pulls" \
            -q '[.[] | select(.state == "open" and .head.sha == env.SHA and .head.repo.full_name == env.GITHUB_REPOSITORY)][0]')
          [ -n "$pr" ] && [ "$pr" != "null" ] || skip "no open PR from this repo has $SHA as its head"
          n=$(jq -r .number <<< "$pr")
          [ "$(jq -r .user.id <<< "$pr")" = 6550688 ] || skip "#$n isn't johnpangalos's"
          [ "$(jq -r .draft <<< "$pr")" = false ] || skip "#$n is a draft"

          # Low risk: docs, the README, playground example pages, and a component's own tests.
          # Everything else (the package, the theme and its token test, Figma exports, the Figma
          # specs and the measuring code, changesets, CI, .claude/, CLAUDE.md, REVIEW.md,
          # dependencies, config) needs a person. Whole names are matched in jq, so a name with
          # a newline in it can't pass as two, and a failed request stops the job (set -e).
          outside=$(gh api --paginate "repos/$R/pulls/$n/files" -q '.[] | .filename, (.previous_filename // empty)
            | select(test("\\A(docs/.+|README\\.md|apps/playground/app/examples/.+|packages/ui/src/[^/]+/[^/]+\\.test\\.tsx?)\\z") | not)
            | @json')
          [ -z "$outside" ] || skip "#$n touches $(head -n 1 <<< "$outside"), which needs a person"

          # The latest summary each review posted for this exact commit, from the Claude app only.
          summary() {
            PREFIX=$1 gh api --paginate "repos/$R/issues/$n/comments" \
              -q '.[] | select(.user.login == "claude[bot]" and (.body | startswith(env.PREFIX))) | .body | @json' \
              | tail -n 1 | jq -r 'select(. != null)'
          }
          review=$(summary "<!-- claude-review sha=$SHA ")
          [ -n "$review" ] || skip "the Claude review of $SHA hasn't posted its summary yet"
          head -n 1 <<< "$review" | grep -q ' risk=low ' || skip "the Claude review rated #$n as needing a person"
          grep -qx 'Nothing to fix\.' <<< "$review" || skip "the Claude review of $SHA has findings"
          security=$(summary "<!-- claude-security-review sha=$SHA ")
          [ -n "$security" ] || skip "the security review of $SHA hasn't posted its summary yet"
          grep -qx 'No security findings\.' <<< "$security" || skip "the security review of $SHA has findings"

          # --match-head-commit: if a push landed since the reviews read $SHA, this fails.
          gh pr merge "$n" --repo "$R" --auto --squash --match-head-commit "$SHA"
          echo "Auto-merge on for #$n at $SHA: low risk, both reviews clean." | tee -a "$GITHUB_STEP_SUMMARY"
