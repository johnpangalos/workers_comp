name: Claude review

# Claude reviews every pull request before a person does: parallel bug hunting, a separate
# verification pass that drops anything it can't back with a file and line, and inline
# comments tagged Important, Nit or Pre-existing. What matters in this repo is in REVIEW.md.
#
# No secrets. Claude: workload identity federation trades this run's GitHub OIDC token for a
# short-lived Anthropic one; the IDs are repository variables (see REVIEW.md, "Setup").
# GitHub: the Claude GitHub App, as a short-lived token per run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push replaces the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and the "Version Packages" PR the release workflow opens.
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the OIDC token both exchanges start from
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to diff against the commit the last review saw

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}

            Review this pull request. The PR head is checked out. Read REVIEW.md first: it says
            what counts as a bug here, what to skip, and how to write findings. CLAUDE.md is
            already loaded and its rules are review criteria too.

            1. Context. Read the PR title and description (`gh pr view`) for what it intends.
               Read earlier reviews: top-level comments (`gh pr view --comments`) and inline
               comments (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`).
               Your earlier summaries start with `<!-- claude-review sha=<sha> round=<n> -->`.
               This run's round is the highest earlier n plus 1, or 1 if there is none.

            2. Scope. In round 1 and 2, review the whole diff (`gh pr diff`). From round 3,
               review only what changed since the last reviewed sha
               (`git diff <sha> ${{ github.event.pull_request.head.sha }}`), and if the last sha
               is not an ancestor of HEAD (a force-push), review the whole diff again.

            3. Hunt. Launch three subagents in parallel, each given the diff, the PR's intent
               and REVIEW.md, and each reading the surrounding code in the repo, not just the
               diff:
               - correctness: logic errors, broken behaviour, missed states and edge cases,
                 type holes, tests that don't test what they claim;
               - this repo's rules: everything under "What failure looks like" in REVIEW.md and
                 the rules in CLAUDE.md;
               - security and robustness: injection, unsafe HTML, secrets, workflow permissions
                 and untrusted input in `.github/`, dependency changes.
               Each returns candidate findings with file, line, the evidence, and a severity.

            4. Verify. For every candidate, launch a separate subagent that did not find it and
               ask it to prove the finding wrong by reading the code. Keep a finding only if the
               verifier confirms it with a concrete file and line. Drop anything that is style
               only, anything oxlint, oxfmt, tsc or the tests already catch, anything already
               posted in an earlier round (open or resolved), and duplicates. Where one cause
               shows up in several places, keep one finding that names the class of bug and
               lists every place.

            5. Post. One inline comment per surviving finding, on the line, with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Start
               each with its tag in bold: **Important**, **Nit** or **Pre-existing** (a real
               bug the PR didn't introduce). At most 3 Nits. If an earlier inline finding of
               yours is fixed by this push, reply to its thread once saying which commit fixed
               it; don't reply to the others again.

            6. Summary. Post one top-level comment with `gh pr comment`. Its first line is
               exactly `<!-- claude-review sha=${{ github.event.pull_request.head.sha }} round=<n> -->`.
               Then the count first, e.g. "2 Important, 1 Nit", or "Nothing to fix." when there is
               nothing; then one line per finding; then nothing else, no praise and no recap of
               the PR. In round 4 or later, with Important findings still open, say so and ask
               whether the approach should change rather than going another round.

            Only communicate through those GitHub comments. Don't edit files or push.
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
