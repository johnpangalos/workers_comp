name: Merge non-breaking PRs

# Review happens before the PR, locally, with feature-flow-lite. On the PR, this only decides
# whether it can merge with no person reading it: it does unless it's breaking for the apps
# that use @workers-comp/ui or touches what the safeguards rest on (docs/merge-risk.md). It runs
# when CI or the PR title check finishes on a PR's commit, so editing a PR's description
# re-rates it. It runs from main (workflow_run always does), and so do its scripts, so a PR
# can't change the rules it is judged by. Separate jobs, so the Claude call never runs next to
# a token that can write; each runs one script in .github/scripts/claude-risk/:
#   gate:   the owner's PR, from a branch here, not a draft, CI passed on the commit, no
#           always-you file, no change to the existing Figma measurement unless it's a
#           component's own, changed with that component's code, no major changeset or `!`
#           title, a changeset if the package changes. Otherwise it stops, with no Claude call.
#   rate:   one Messages API request to Claude (Haiku): is it breaking, or does it weaken a
#           check? A verdict as schema-checked JSON, `merge-approved` or `needs-human`.
#   merge:  on exactly `merge-approved`, squash-merges that exact commit.
#   report: keeps one comment on the PR saying where it stopped and why, for the person who
#           reviews it.
# No PR code runs: its commits are fetched and diffed, never checked out.

on:
  workflow_run:
    workflows: [CI, PR title]
    types: [completed]

# On a push CI and the title check both finish, so one commit can start two runs: the second
# waits, then finds the PR already merged, or rates it again.
concurrency:
  group: claude-risk-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read # whether CI passed on the commit
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      pr: ${{ steps.gate.outputs.pr }}
      base: ${{ steps.gate.outputs.base }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/claude-risk/gate.ts

  rate:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the PR description
      id-token: write # the OIDC token the Claude API token is exchanged from
    outputs:
      verdict: ${{ steps.rate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: rate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          BASE: ${{ needs.gate.outputs.base }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: node .github/scripts/claude-risk/rate.ts

  merge:
    needs: [gate, rate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to merge
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERDICT: ${{ needs.rate.outputs.verdict }}
        run: node .github/scripts/claude-risk/merge.ts

  report:
    needs: [gate, rate, merge]
    # Whatever the others did, once the gate found the PR.
    if: always() && needs.gate.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          RATE_RESULT: ${{ needs.rate.result }}
          VERDICT: ${{ needs.rate.outputs.verdict }}
          MERGE_RESULT: ${{ needs.merge.result }}
        run: node .github/scripts/claude-risk/report.ts
