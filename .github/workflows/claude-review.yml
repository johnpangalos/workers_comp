name: Claude review

# Claude reviews every pull request before a person does: parallel bug hunting, a vote of
# separate verifiers on each finding, and inline comments tagged Important, Nit or
# Pre-existing. Security has its own pass (claude-security-review.yml), and `@claude` on a PR
# asks for a fix (claude-fix.yml). What matters in this repo is in REVIEW.md.
#
# No secrets. Claude: workload identity federation trades this run's GitHub OIDC token for a
# short-lived Anthropic one; the IDs are repository variables (see REVIEW.md, "Setup").
# GitHub: the Claude GitHub App, as a short-lived token per run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push replaces the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only PRs johnpangalos opened (by user ID, which survives a rename), from a branch in this
    # repo: never forks or anyone else. Skip drafts, and the "Version Packages" PR the release
    # workflow opens.
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 6550688
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the OIDC token both exchanges start from
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false # to diff against the commit the last review saw

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}

            Review this pull request for bugs. The PR head is checked out. Read REVIEW.md first:
            it says what counts as a bug here, what to skip, and how to write findings.
            CLAUDE.md is already loaded and its rules are review criteria too. Security is
            reviewed separately; leave it out.

            1. Context. Read the PR title and description (`gh pr view`) for what it intends.
               Read earlier reviews: top-level comments (`gh pr view --comments`) and review
               threads, with whether each is resolved:
               `gh api graphql -f query='{ repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") { pullRequest(number: ${{ github.event.pull_request.number }}) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 20) { nodes { databaseId author { login } body } } } } } } }'`.
               Your earlier summaries start with `<!-- claude-review sha=<sha> round=<n> -->`.
               This run's round is the highest earlier n plus 1, or 1 if there is none.

            2. Scope. In round 1 and 2, review the whole diff (`gh pr diff`). From round 3,
               review only what changed since the last reviewed sha
               (`git diff <sha> ${{ github.event.pull_request.head.sha }}`), and if the last sha
               is not an ancestor of HEAD (a force-push), review the whole diff again.

            3. Hunt. Launch three subagents in parallel, each given the diff, the PR's intent
               and REVIEW.md, and each reading the surrounding code in the repo, not just the
               diff:
               - correctness: logic errors, broken behaviour, missed states and edge cases,
                 type holes, tests that don't test what they claim;
               - this repo's rules: everything under "What failure looks like" in REVIEW.md and
                 the rules in CLAUDE.md;
               - intent and fit: does the change do what the PR says, fit how the code around
                 it works, and break nothing that calls it; on a bug fix, does it fix the root
                 cause; does it leave a line in CLAUDE.md or REVIEW.md out of date.
               Each returns candidate findings with file, line, the evidence, and a severity.

            4. Verify. For every candidate, launch three verifier subagents in parallel that
               did not find it, and ask each to prove the finding wrong by reading the code.
               Keep a finding only if at least two of the three confirm it with a concrete file
               and line. Drop anything that is style only, anything oxlint, oxfmt, tsc or the
               tests already catch, anything already posted in an earlier round (open or
               resolved), and duplicates. Where one cause shows up in several places, keep one
               finding that names the class of bug and lists every place.

            5. Post. One inline comment per surviving finding, on the line, with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`, most
               severe first. Start each with its tag in bold: **Important**, **Nit** or
               **Pre-existing** (a real bug the PR didn't introduce). At most 3 Nits.

            6. Clear what's fixed. For each unresolved thread you started (not the security
               review's) whose finding this push fixes, reply once naming the commit
               (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<databaseId>/replies -f body=...`),
               then resolve it:
               `gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "<id>"}) { thread { isResolved } } }'`.
               Leave every other thread alone.

            7. Summary. Post one top-level comment with `gh pr comment`. Its first line is
               exactly `<!-- claude-review sha=${{ github.event.pull_request.head.sha }} round=<n> -->`.
               Then the count first, e.g. "2 Important, 1 Nit", or "Nothing to fix." when there is
               nothing; then one line per finding, Important first; then nothing else, no praise
               and no recap of the PR. After three rounds (round 4 or later), with Important
               findings still open, say so and ask the author to step back and reconsider the
               approach rather than going another round.

            Only communicate through those GitHub comments and thread resolutions. Don't edit
            files or push.
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api graphql:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
