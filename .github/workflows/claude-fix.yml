name: Claude fix

# `@claude` in a pull request comment, review or review reply asks Claude to fix the PR's open
# findings (or whatever the comment asks). It commits and pushes to the PR branch, and that
# push gets a fresh review (claude-review.yml), which resolves the threads it fixed. The
# reviewer never fixes and the fixer never reviews.
#
# Only johnpangalos can trigger it (by user ID, which survives a rename); anyone else's
# `@claude` is skipped before a token is requested. Comment events don't carry the
# pull_request OIDC subject, so this uses its own federation rule (REVIEW.md, "Setup").

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One fix per PR at a time; a second request waits rather than cancelling a push half done.
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) &&
      (github.event.comment.user.id || github.event.review.user.id) == 6550688
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # to read CI results on the PR
    steps:
      # The comment is yours, but the PR could still come from a fork, whose code this job
      # would run with write access. Refuse those.
      - name: Only PRs from this repo's own branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)" != "false" ]; then
            echo "::error::PR #$PR comes from a fork; claude-fix only works on branches in this repository."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FIX_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,Edit,Write,Bash(pnpm:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh api graphql:*),Bash(gh api repos/${{ github.repository }}/pulls/:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --append-system-prompt "You fix findings on this pull request. Unless the comment says otherwise, fix every unresolved review thread from the Claude review (tagged **Important**, **Nit** or **Pre-existing**) and the security review (tagged **Security**). Read them with gh api graphql (repository > pullRequest > reviewThreads, with isResolved and the comments). Where a finding names a class of bug, fix every place it occurs. Follow CLAUDE.md: Figma decides, theme utilities only, never loosen a Figma test or edit an export in apps/playground/figma/, and add a changeset if what @workers-comp/ui ships changes. Before you push, run pnpm format:check, pnpm lint, pnpm typecheck, pnpm test and pnpm build, and push only when they pass. Don't run pnpm test:figma here: it only matches Figma on macOS, so CI's figma job checks it after your push; say in your reply when the change needs it. Commit with a Conventional Commits message. Reply on each thread (gh api repos/<repo>/pulls/<number>/comments/<databaseId>/replies -f body=...) with what you changed, or, if you think the finding is wrong, why; don't resolve threads yourself: the next review resolves the ones the push fixed, and a person resolves the rest."
