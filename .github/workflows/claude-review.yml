name: Claude review

# Claude reviews every pull request before a person does: parallel bug hunting, a vote of
# separate verifiers on each finding, and inline comments tagged Important, Nit or
# Pre-existing. Security has its own pass (claude-security-review.yml), and `@claude` on a PR
# asks for a fix (claude-fix.yml). What matters in this repo is in REVIEW.md.
#
# No secrets. Claude: workload identity federation trades this run's GitHub OIDC token for a
# short-lived Anthropic one; the IDs are repository variables (see REVIEW.md, "Setup").
# GitHub: the Claude GitHub App, as a short-lived token per run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push replaces the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only PRs johnpangalos opened (by user ID, which survives a rename), from a branch in this
    # repo: never forks or anyone else. Skip drafts, and the "Version Packages" PR the release
    # workflow opens.
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 6550688
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the OIDC token both exchanges start from
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }} # the PR head, not the merge commit
          fetch-depth: 0 # to diff against the commit the last review saw
          persist-credentials: false

      # Claude gets no GraphQL, which would let it run any mutation, merging included. This
      # step reads the review threads for it, with the diff and the round, into .git/ (inside
      # the workspace Claude can read, and never committed); the last step resolves the threads
      # it cleared.
      - name: Read the PR, its review threads and the last round
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api graphql -F number="$PR" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 20) { nodes { databaseId author { login } body } } } } } } }' \
            -q '.data.repository.pullRequest.reviewThreads.nodes' > "$GITHUB_WORKSPACE/.git/claude-review-threads.json"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$GITHUB_WORKSPACE/.git/claude-pr.diff"
          # The round and the commit the last review saw, from the latest claude[bot] summary.
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '.[] | select(.user.login == "claude[bot]" and (.body | startswith("<!-- claude-review sha="))) | .body | split("\n")[0]' | tail -n 1)
          round=$(sed -n 's/.* round=\([0-9][0-9]*\) .*/\1/p' <<< "$last")
          sha=$(sed -n 's/^<!-- claude-review sha=\([0-9a-f]\{40\}\) .*/\1/p' <<< "$last")
          echo "round=$(( ${round:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "last_sha=${sha:-none}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # The fixer pushes as claude[bot]; without this the review of its push is refused as a
          # bot run. The PR-author check above still decides whose PRs are reviewed.
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            ROUND: ${{ steps.context.outputs.round }}
            LAST REVIEWED SHA: ${{ steps.context.outputs.last_sha }}

            Review this pull request for bugs. The PR head is checked out. Read REVIEW.md first:
            it says what counts as a bug here, what to skip, and how to write findings.
            CLAUDE.md is already loaded and its rules are review criteria too. Security is
            reviewed separately; leave it out.

            1. Context. Read the PR title and description (`gh pr view`) for what it intends,
               and the earlier review threads, with whether each is resolved, in
               `${{ github.workspace }}/.git/claude-review-threads.json`.

            2. Scope. In rounds 1 and 2, review the whole diff, which is in
               `${{ github.workspace }}/.git/claude-pr.diff`. From round 3, review only what changed
               since the last reviewed sha (`git diff <LAST REVIEWED SHA> HEAD`), unless that sha
               is not an ancestor of HEAD (a force-push): then the whole diff again.

            3. Hunt. Launch three subagents in parallel, each given the diff file's path, the
               PR's intent and REVIEW.md, and each reading the surrounding code in the repo, not
               just the diff:
               - correctness: logic errors, broken behaviour, missed states and edge cases,
                 type holes, tests that don't test what they claim;
               - this repo's rules: everything under "What failure looks like" in REVIEW.md and
                 the rules in CLAUDE.md;
               - intent and fit: does the change do what the PR says, fit how the code around
                 it works, and break nothing that calls it; on a bug fix, does it fix the root
                 cause; does it leave a line in CLAUDE.md or REVIEW.md out of date.
               Each returns candidate findings with file, line, the evidence, and a severity.

            4. Verify. Launch three verifier subagents in parallel, none of them a hunter, each
               given every candidate (file, line, claim, evidence) and asked to prove each one
               wrong by reading the code. Keep a candidate only if at least two of the three
               confirm it with a concrete file and line. Then drop what REVIEW.md's Skip section
               lists, anything already posted in an earlier round (open or resolved), and
               duplicates. Where one cause shows up in several places, keep one
               finding that names the class of bug and lists every place.

            5. Post. One inline comment per surviving finding, on the line, with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`, most
               severe first. Start each with its tag in bold: **Important**, **Nit** or
               **Pre-existing** (a real bug the PR didn't introduce). At most 3 Nits.

            6. Clear what's fixed. For each unresolved thread you started (not the security
               review's) whose finding this push fixes, reply once naming the commit
               (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<databaseId>/replies -f body=...`),
               and put its id on the resolve line of your summary (step 8). Leave every other
               thread alone.

            7. Risk. Decide whether this change could merge with no person reading it. `low` only
               if it is docs, copy, playground example pages, or tests that only add coverage, and
               changes nothing the published package, the build, CI, the release or these review
               instructions depend on. Anything else, or any doubt, is `person`: a test that
               loosens a check, docs that now contradict the code, an example page a Figma spec
               measures that no longer shows every node. The auto-merge workflow checks the paths
               itself; this is your read of the change, and it can only make that stricter.

            8. Summary. Post one top-level comment with `gh pr comment`. Its first line is
               exactly `<!-- claude-review sha=${{ github.event.pull_request.head.sha }} round=${{ steps.context.outputs.round }} risk=<low|person> -->`.
               The second line is the count, e.g. "2 Important, 1 Nit", or exactly "Nothing to fix."
               when there is nothing; then one line per finding, Important first; then nothing
               else, no praise and no recap of the PR, except a last line
               `<!-- resolve: <id> <id> -->` with the threads from step 6, if there are any; the
               workflow resolves them after you finish. From round 4, with Important findings
               still open, say so and ask the author to step back and reconsider the
               approach rather than going another round.

            Launch every subagent with `model: "haiku"`.

            Only communicate through those GitHub comments. Don't edit files or push.
          claude_args: |
            --model claude-haiku-5-5
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      # Resolves the threads the summary lists on its `<!-- resolve: … -->` line, but only open
      # ones that the Claude review (not the security review) started.
      - name: Resolve the threads the review cleared
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PREFIX: "<!-- claude-review sha=${{ github.event.pull_request.head.sha }} "
        run: |
          set -euo pipefail
          body=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '.[] | select(.user.login == "claude[bot]" and (.body | startswith(env.PREFIX))) | .body | @json' \
            | tail -n 1 | jq -r 'select(. != null)')
          read -ra ids <<< "$(sed -n 's/^<!-- resolve: \(.*\) -->$/\1/p' <<< "$body" | head -n 1)"
          for id in ${ids[@]+"${ids[@]}"}; do
            jq -e --arg id "$id" 'any(.[]; .id == $id and (.isResolved | not)
              and ((.comments.nodes[0].author.login // "") | sub("\\[bot\\]$"; "")) == "claude"
              and (.comments.nodes[0].body | test("\\A\\*\\*(Important|Nit|Pre-existing)\\*\\*")))' "$GITHUB_WORKSPACE/.git/claude-review-threads.json" > /dev/null || continue
            gh api graphql -f id="$id" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' > /dev/null
            echo "Resolved $id"
          done
