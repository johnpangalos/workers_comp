name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main. Its own workflow, so that
# editing a PR's title or description reruns only this, not CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a conventional commit, e.g. \"feat(ui): add the Input component\". Got: $TITLE"
            exit 1
          fi
