name: Claude fix

# `@claude` in a pull request comment, review or review reply asks Claude to fix the PR's open
# findings (or whatever the comment asks). It commits and pushes to the PR branch, and that
# push gets a fresh review (claude-review.yml), which resolves the threads it fixed. The
# reviewer never fixes and the fixer never reviews.
#
# Only johnpangalos can trigger it (by user ID, which survives a rename); anyone else's
# `@claude` is skipped before a token is requested. Comment events don't carry the
# pull_request OIDC subject, so this uses its own federation rule (REVIEW.md, "Setup").

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One fix per PR at a time; a second request waits rather than cancelling a push half done.
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    # A comment, review or review reply that mentions @claude, from johnpangalos, on a PR (an
    # issue_comment can also be on a plain issue).
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body || github.event.review.body, '@claude') &&
      (github.event.comment.user.id || github.event.review.user.id) == 6550688
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # to read CI results on the PR
    steps:
      # The comment is yours, but the PR could still come from a fork, whose code this job
      # would run with write access. Refuse those.
      - name: Only PRs from this repo's own branches
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          pr=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository,headRefName)
          if [ "$(jq -r .isCrossRepository <<< "$pr")" != "false" ]; then
            echo "::error::PR #$PR comes from a fork; claude-fix only works on branches in this repository."
            exit 1
          fi
          echo "head=$(jq -r .headRefName <<< "$pr")" >> "$GITHUB_OUTPUT"
      # The PR's branch, so dependencies are installed from it rather than from main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      # Claude gets no GraphQL, which would let it run any mutation, merging included. This
      # step reads the review threads for it, into .git/ (inside the workspace Claude can read,
      # and never committed); the next review resolves what a fix cleared.
      - name: Read the review threads
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api graphql -F number="$PR" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 20) { nodes { databaseId author { login } body } } } } } } }' \
            -q '.data.repository.pullRequest.reviewThreads.nodes' > "$GITHUB_WORKSPACE/.git/claude-review-threads.json"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FIX_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: |
            --model claude-haiku-5-5
            --allowedTools "Agent,Task,Read,Grep,Glob,Edit,Write,Bash(pnpm check),Bash(pnpm format),Bash(pnpm format:check),Bash(pnpm lint),Bash(pnpm lint:*),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm build),Bash(pnpm --filter @workers-comp/ui exec vitest run:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number || github.event.pull_request.number }}/comments:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --append-system-prompt "You fix findings on this pull request. Launch any subagent with model haiku. Unless the comment says otherwise, fix every unresolved review thread from the Claude review (tagged **Important**, **Nit** or **Pre-existing**) and the security review (tagged **Security**). They are in ${{ github.workspace }}/.git/claude-review-threads.json, with isResolved and each thread's comments. Where a finding names a class of bug, fix every place it occurs. Follow CLAUDE.md: Figma decides, theme utilities only, never loosen a Figma test or edit an export in apps/playground/figma/, and add a changeset if what @workers-comp/ui ships changes. Before you push, run pnpm check (format, lint, types, tests and build) and push only when it passes. Don't run pnpm test:figma here: it only matches Figma on macOS, so CI's figma job checks it after your push; say in your reply when the change needs it. Commit with a Conventional Commits message. Reply on each thread (gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number || github.event.pull_request.number }}/comments/<databaseId>/replies -f body=...) with what you changed, or, if you think the finding is wrong, why; don't resolve threads yourself: the next review resolves the ones the push fixed, and a person resolves the rest."
