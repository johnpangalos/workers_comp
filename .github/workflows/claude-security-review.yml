name: Claude security review

# A security pass on every pull request, separate from the bug review (claude-review.yml) so
# neither crowds out the other. Its findings are inline threads like the bug review's: with
# "Require conversation resolution" on main, an open one blocks the merge until it's fixed or
# resolved with a reason. Same no-secret setup as the bug review (REVIEW.md, "Setup").

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Do a security review of this pull request. The PR head is checked out; the diff is
            `gh pr diff`. Report only vulnerabilities this PR introduces that you are confident
            are exploitable, not hardening ideas. A missed theoretical issue costs less than a
            false alarm that sends someone to change working code.

            What to look for, reading the surrounding code and not just the diff:
            - Untrusted input reaching a sink: HTML (`dangerouslySetInnerHTML`, `innerHTML`),
              URLs (`href`/`src` that can be `javascript:`), `eval`/`new Function`, shell
              commands, file paths.
            - Secrets or credentials in code, config, tests or logs.
            - Workflows in `.github/`: wider `permissions`, `pull_request_target` or
              `workflow_run` that runs PR code, PR-controlled text (titles, branch names,
              bodies, comments) interpolated into `run:` scripts or prompts, actions not
              pinned to a trusted publisher, a long-lived secret where a short-lived token
              would do.
            - Dependencies: a new package or a changed resolution in `pnpm-lock.yaml`, an
              install script, a package pulled from a git URL or tarball, a typosquat.
            - Anything the published `@workers-comp/ui` package now ships that a consumer's app
              would execute.

            Skip: denial of service and resource exhaustion, rate limiting, missing hardening
            with no concrete exploit, issues only in tests or docs, and anything that needs an
            attacker who can already push to this repo.

            1. Read your earlier findings: review threads with
               `gh api graphql -f query='{ repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") { pullRequest(number: ${{ github.event.pull_request.number }}) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 20) { nodes { databaseId author { login } body } } } } } } }'`.
               Yours start with **Security**.
            2. For each candidate, launch three verifier subagents in parallel and ask each to
               show it can't be exploited. Keep it only if at least two find a concrete attack
               path with a file and line. Drop anything already posted.
            3. Post one inline comment per finding with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`,
               starting **Security: High** or **Security: Medium**, then the attack path and
               the fix.
            4. For each unresolved thread of yours whose issue this push fixes, reply once
               naming the commit
               (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<databaseId>/replies -f body=...`)
               and resolve it
               (`gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "<id>"}) { thread { isResolved } } }'`).
            5. Post one top-level comment with `gh pr comment`, first line exactly
               `<!-- claude-security-review sha=${{ github.event.pull_request.head.sha }} -->`,
               then the count ("1 High") or "No security findings.", then one line per finding.

            Only communicate through those GitHub comments and thread resolutions. Don't edit
            files or push.
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api graphql:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
